<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#881337" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <!-- Medical Cross / Plus Emblem -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Vertical bar -->
    <rect x="220" y="128" width="72" height="256" rx="24" />
    <!-- Horizontal bar -->
    <rect x="128" y="220" width="256" height="72" rx="24" />
  </g>
  <!-- Subtle center pulse dot -->
  <circle cx="256" cy="256" r="16" fill="#f43f5e" opacity="0.9" />
</svg>
